    <script type="text/x-docstrap-searchdb">
    {"classes.list.html":{"id":"classes.list.html","title":"Classes","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Classes Classes App AppError BaseObject Diagnostics FieldValidator Loader Registry User Utils × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"index.html":{"id":"index.html","title":"Index","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"App.html":{"id":"App.html","title":"Class: App","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: App App This class is the central app context: it travels as envelope (class 'App', id {appAlias}_{version}) at position 1 of the collector and carries currentUserId, currentUserRoleId and the serialized view in its data payload — the replacement of the former header variables. As the only class on every view it owns the central error display (showAppErrors), the JS error channel (reportError incl. window.onerror) and the blueprint route (newObject). new App() This method is the constructor of the class: it wires the global registry and the error counter. The error channel is app-wide and central: the App is loaded on every view, therefore it takes the display of every AppError instance — no template needs own error code. It uses onAppReady instead of a direct call, because the registry is the interface only after the complete registration (events instead of order). Version: 0.2.11 Since: 2026-10-20 Author: Markus Götz Returns: Type void Example const app = window[ appAlias ].registry.get( 'app' ); Methods currentUser() This method returns the login user from the registry — the id (currentUserId) travels as envelope data over fillObject onto the instance. Returns: user The User instance of the login user or undefined Type object Example const user = app.currentUser(); &lt;async&gt; loadResources() This method loads appError.js itself: the Loader loads classes only on envelope demand, but the JS error channel needs the class guaranteed before window.onerror is applicable. The promise dedupe in the Loader makes double loads harmless. It registers window.onerror only after the load — the resource readiness travels via the loadResources promise the Loader awaits. Returns: Type Promise.&lt;void&gt; Example await app.loadResources(); &lt;async&gt; newObject(newClass) This method demands a blueprint on demand: it loads an empty instance of the class over the view viewNewObject and registers it under the id 'new' — templates access the finished instance over registry.onReady( className, 'new', ... ) (with replay, timing irrelevant). Every disturbance runs over the JS error channel as overlay instead of as silent silence. Parameters: Name Type Description newClass string The PHP class name of the blueprint Returns: instance The registered blueprint instance Type Promise Example const blueprint = await app.newObject( 'User' ); reportError(error, source) This method reports a JS error over the error channel: the frontend stays generic (leak shielding analogous to the PHP channel), full details only into the console. Total method: the catch never re-throws — console.error triggers no window.onerror, so an exception in the error channel (e.g. from showError) stops the recursion. Own id space errorjs{N}: the PHP envelope ids error{N} would otherwise overwrite a JS error silently in the register phase. Parameters: Name Type Description error * The occurred error (Error object or message text) source string The origin description of the error Returns: Type void Example app.reportError( error, 'newObject: User' ); showAppErrors() This method shows every registered AppError instance in the overlay — the central sweep on app-ready, templates stay free of error code. Returns: Type void Example app.showAppErrors(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"AppError.html":{"id":"AppError.html","title":"Class: AppError","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: AppError AppError This class is a frontend error card: message, severity ('error' | 'warning') and source travel as properties, the display runs as DOM card over the overlay of the BaseObject. The PHP channel delivers the envelopes (ids error{N}), the JS channel registers its own instances (ids errorjs{N}). Deliberately not named Error: Error is a built-in in PHP (Throwable base) as well as in JavaScript (window.Error). new AppError() This method is the constructor of the class: it wires only the BaseObject base (fieldValidator, loader/config references, global event handlers). Version: 0.2.10 Since: 2026-10-20 Author: Markus Götz Returns: Type void Example const appErrorInstance = new AppError(); Methods showError() This method builds the error card (headline, message, id and source meta lines) and shows it in the overlay — the severity becomes part of the css class (app-error-severity-*). Returns: Type void Example appErrorInstance.showError(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"BaseObject.html":{"id":"BaseObject.html","title":"Class: BaseObject","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: BaseObject BaseObject This class is the JavaScript base class of every business class: it carries the envelope data (fillObject), delivers the default getter/setter pair, clones templates with suffixed DOM ids into the page (multi-instance cards), owns the default resource loader and hosts the global click/Enter delegation for the CRUD forms as well as the persistent overlay of the JS error channel. The server counterpart is the PHP BaseObject — every business object arrives as envelope (class, id, data) through the collector and the Loader instantiates it from this family. new BaseObject() This method is the constructor of the class: it wires the own fieldValidator, the global loader/config references, the debug flag and registers the global event handlers exactly once per page load. Version: 0.2.11 Since: 2026-10-15 Author: Markus Götz Returns: Type void Example const baseObject = new BaseObject(); Methods activateInstallAppButton(installEvent) This method activates the app install buttons when the browser offers a PWA install prompt: it enables the buttons, unhides them and routes their clicks to the prompt of the install event. Parameters: Name Type Description installEvent object The beforeinstallprompt event with the prompt() method Returns: Type void Example instance.activateInstallAppButton( installEvent ); addContentToOverlay(content) This method fills the overlay content: objects (DOM nodes) get appended, strings get concatenated as innerHTML. A missing overlay is created on the fly. Parameters: Name Type Description content object | string The content as DOM node or HTML string Returns: Type void Example instance.addContentToOverlay( '&lt;p&gt;Fehler&lt;/p&gt;' ); appendTemplate(templateId, targetId, setId) This method clones the content of a template element into the target container. With setId it suffixes every id and for attribute with '-' + validateId( this.id ) — parallel instance cards stay addressable over unique DOM ids (CSS selectors). The template content lives in an own document fragment: DOM queries must run after this append, not before. Parameters: Name Type Default Description templateId string The DOM id of the template element targetId string The DOM id of the target container setId boolean true True to suffix the ids (default true) Returns: Type void Example instance.appendTemplate( 'user-form-template', 'user-cards', true ); closeOverlay() This method removes the overlay when it exists. Returns: Type void Example instance.closeOverlay(); crudPostObject(formId, action) This method submits a form as POST request to the current URL: it writes the action into the hidden action input and lets the browser send the form (full page reload — actions answer with HTML views). Parameters: Name Type Description formId string The DOM id of the form action string The action name (data-action of the trigger button) Returns: Type void Example instance.crudPostObject( 'user-form', 'User::saveUser' ); fillForm(formId) This method fills a cloned form with the instance data: every element with a data-property attribute receives its property value — inputs and selects as value, everything else as innerHTML. Missing properties are skipped. Expects the unsuffixed form id. Parameters: Name Type Description formId string The unsuffixed DOM id of the form Returns: Type void Example instance.fillForm( 'user-form' ); fillObject() This method copies the data payload of the envelope (this.data) onto own properties: properties that are already set keep their value (constructor properties survive), the rest is filled from the data. The data carrier is deleted afterwards. Returns: Type void Example instance.fillObject(); get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value See: BaseObject#set Returns: value The value of the property Type * Example const value = instance.get( 'formId' ); &lt;async&gt; loadResources() This method is the default resource loader: it resolves immediately — the resource readiness travels only via the loadResources promise (the Loader awaits it) and the registry ready events. Classes with own resources (Chart.js, stylesheets) overwrite it and await their own loads — the Loader calls it after the instantiation and awaits it before the instance registers. Returns: Type Promise.&lt;void&gt; Example await instance.loadResources(); registerEventHandler() This method registers the global event handlers of the class exactly once per page load (guard via Utils.globalRegisteredEvents): the click delegation for submit and CRUD buttons (save, delete, new), the Enter key delegation on input fields and the PWA install prompt. After DOM readiness it resets marked forms. Returns: Type void Example instance.registerEventHandler(); removeTemplates() This method removes every template element from the page — it must run after the blueprint on-ready callback (appendTemplate still needs the template element). Returns: Type void Example instance.removeTemplates(); resetForms() This method resets every form that carries a hidden resetForm input with value 1 — the server marks forms this way that should start empty after a save. Returns: Type void Example instance.resetForms(); set(property, value) This method is the default setter of the class. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: BaseObject#get Returns: Type void Example instance.set( 'formId', 'user-form' ); setSelectsOptions(formId, setId) This method fills the selects of a form with the options of the fields property: fields.{name}.options (value → label) — the name attribute of the select is the key. Parameters: Name Type Default Description formId string The DOM id of the form setId boolean true True to suffix the form id for cloned cards (default true) Returns: Type void Example instance.setSelectsOptions( 'user-form', true ); showOverlay() This method builds the page persistent overlay: one '#overlay' root element with outer/content containers and a close button (Escape and click). The content arrives afterwards over addContentToOverlay — the overlay is the display route of the JS error channel. Returns: Type void Example instance.showOverlay(); validateForm(formId, setId) This method binds the instance owned fieldValidator onto the form and starts the live validation: set( 'formId', ... ) binds the fieldValidator unconditionally — every instance validates its own form, parallel cards stay independent. Parameters: Name Type Default Description formId string The DOM id of the form setId boolean true True to suffix the form id for cloned cards (default true) Returns: Type void Example instance.validateForm( 'user-form', true ); validateId(id) This method escapes an instance id into a DOM and CSS safe form: '@' becomes _at_, '.' becomes _dot_, whitespace becomes '-' and every remaining special character '_' — user ids are e-mail addresses and the suffixes end in CSS selectors (#form-...). Parameters: Name Type Description id string The raw instance id Returns: id The DOM safe id fragment Type string Example const suffix = instance.validateId( 'user@example.de' ); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"Diagnostics.html":{"id":"Diagnostics.html","title":"Class: Diagnostics","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: Diagnostics Diagnostics This class is the frontend instance of the Diagnostics: It contains the PHP unit testing results and has a form field validator via the BaseObject. The class fills the container with the results of the individual test suites. new Diagnostics() This method is the constructor of the class: it wires only the BaseObject base — the diagnostics data arrives as envelope (fillObject). Version: 0.2.14 Since: 2026-10-26 Author: Markus Götz Returns: Type void Example const diagnostics = window[ appAlias ].registry.get( 'diagnostics' ); Methods renderDiagnostics() This method fills the diagnostics containers with the respective test suites. These test suites contain the individual tests with their results. The method will only be fully executed when the page is loaded under the container “#diagnostics-container” exists. Returns: Type void Example diagnostics.renderDiagnostics(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"FieldValidator.html":{"id":"FieldValidator.html","title":"Class: FieldValidator","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: FieldValidator FieldValidator This class represents the FieldValidator class with all properties and methods. The FieldValidator class validates input fields as well as passwords and email addresses and throws form errors if necessary. If a button with CSS class \"submit\", \"save\" or \"new\" is present in a form, it will be disabled or enabled. new FieldValidator() This method is the constructor of the class. Version: 0.1.0 Since: 2026-06-18 Author: Markus Götz Returns: Type void Example const fieldValidator = new FieldValidator(); Methods get(property) This method is the default getter of the class. Parameters: Name Type Description property string The property of the value See: FieldValidator#set Returns: value The value of the property Type * Example const value = fieldValidator.get( property ); set(property, value) This method is the default setter for the class. Parameters: Name Type Description property string The property that you want to set value * The value you want to set to the property See: FieldValidator#get Returns: Type void Example fieldValidator.set( property, value ); validateFields() This method goes through all the input fields of a form and adds three to each input field added event handler. One when changing the input field, one when leaving the input field and one when pressing a key in the input field. Returns: Type void Example fieldValidator.validateFields(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"Loader.html":{"id":"Loader.html","title":"Class: Loader","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: Loader Loader This class is the dynamic half of the frontend bootstrap: the header loads only the base scripts statically (utils, loader, registry, fieldValidator, BaseObject) — every view class, Chart.js and every stylesheet is requested by the Loader on demand (one class per file, file name = first letter lower case CamelCase). registerObjects() builds the complete bootstrap from the injected collector: per envelope one instance, then all resources awaited, then the registry entries, then app-ready — all-or-nothing; only without debug the rawObjects leave the namespace, a failed resource load keeps them (fail-loud). new Loader() This method is the constructor of the class: it carries the promise dedupe map for script and stylesheet loads (key: file name). Version: 0.2.10 Since: 2026-10-16 Author: Markus Götz Returns: Type void Example const loader = new Loader(); Methods &lt;async&gt; createInstance(rawObject) This method is phase 1 of the envelope pipeline: load the class file (promise dedupe), instantiate the class and copy the envelope data via fillObject(). It does not register yet — waiting for the resources and the registry entry belong to the caller (registerObjects) resp. instantiateRawObject. Parameters: Name Type Description rawObject object The envelope (class, id, data) from the collector Returns: instance The data carrier instance without loaded resources Type Promise Example const instance = await loader.createInstance( rawObject ); &lt;async&gt; instantiateRawObject(rawObject) This method runs the complete envelope pipeline for on-demand loaded objects (blueprints): instantiate, load resources, register in the registry — the onReady event incl. replay fires the registry itself. Parameters: Name Type Description rawObject object The envelope (class, id, data) Returns: instance The registered instance Type Promise Example const blueprint = await loader.instantiateRawObject( rawObject ); loadClassFileAsync(rawObject) This method ensures that the class file of an envelope exists in the window namespace: already loaded classes resolve immediately (constructor check on window), otherwise the Javascript file (firstLetterToLowerCase class name) loads on demand — the promise dedupe of loadScriptAsync prevents parallel double loads. Parameters: Name Type Description rawObject object The envelope with the class property Returns: promise The loading promise of the class file Type Promise Example await loader.loadClassFileAsync( rawObject ); &lt;async&gt; loadNewObject(newClass) This method loads a blueprint on demand (called by app.newObject): fetch on the JSON view viewNewObject, the envelope runs through the standard pipeline — the class file can load for the first time on this way. Errors (HTML answer at a wrong role, empty 500 body, network) tear the promise up, the catch sits in the app wrapper (overlay). Parameters: Name Type Description newClass string The PHP class name of the blueprint Returns: instance The registered blueprint instance (id 'new') Type Promise Example const blueprint = await loader.loadNewObject( 'User' ); loadScriptAsync(scriptName) This method appends a Javascript file into the document head and dedupes over the promises property: parallel calls share the same promise per file name. The URL carries the ?v= cache buster from the config version. Parameters: Name Type Description scriptName string The file name of the Javascript file Returns: promise The loading promise of the script Type Promise Example await loader.loadScriptAsync( 'user.js' ); loadStylesheetAsync(fileName) This method appends a stylesheet file into the document head and dedupes over the promises property — same principle as loadScriptAsync, per file name. The URL carries the ?v= cache buster from the config version. Parameters: Name Type Description fileName string The file name of the stylesheet Returns: promise The loading promise of the stylesheet Type Promise Example await loader.loadStylesheetAsync( 'user.css' ); registerObjects() This method builds the complete app bootstrap: it instantiates every envelope of the collector in parallel, awaits afterwards all loadResources() calls, registers the finished instances in the registry and fires app-ready only then. Without debug it deletes the rawObjects from the namespace afterwards — a failed resource load keeps them (fail-loud). Returns: Type void Example loader.registerObjects(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"Registry.html":{"id":"Registry.html","title":"Class: Registry","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: Registry Registry This class is the instance layer of the frontend: a map of maps — class name (lower case) → (id → instance). The Loader registers the finished instances, templates never read them directly but wait for the registry events (ready per id, class-wide per instance, appReady once) — already fired events replay for late listeners, class-wide listeners subscribe permanently, the timing stays decoupled from the load order. new Registry() This method is the constructor of the class: it carries the registry map (class name → instance map), the ready listeners and the fired event store (replay base — class-wide ready events hold an instance map instead of a single value). Version: 0.2.11 Since: 2026-10-17 Author: Markus Götz Returns: Type void Example const user = window[ appAlias ].registry.get( 'user' ); Members BLUEPRINTID :string The blueprint id of the viewNewObject route (contract with BaseObject::createBlueprint): getAll delivers only real instances — the direct blueprint access runs over get( className, 'new' ) resp. onReady. Type: string Example if( id === Registry.BLUEPRINTID ) return; EVENTNAMEAPPREADY :string The event marker of the one-time app-ready state — the Loader sets it after the complete bootstrap, later onAppReady listeners get the app instance replayed from it. Type: string Example if( this.firedEvents[ Registry.EVENTNAMEAPPREADY ] ) return; Methods eventNameReady(className, id) This method builds the ready event name: ready:{class} or ready:{class}:{id} — the class part is lower case. Parameters: Name Type Description className string The PHP class name id string The instance id Returns: eventName The event name Type string Example const eventName = registry.eventNameReady( 'User', 'max@musterman.de' ); forEachAllInstance(callback) This method walks every registered instance of every class — blueprints included. Parameters: Name Type Description callback function The callback per instance: ( instance, id, className ) Returns: Type void Example registry.forEachAllInstance( ( instance, id, className ) =&gt; { ... } ); forEachClass(callback) This method walks every registered class name. Parameters: Name Type Description callback function The callback per class: ( className ) Returns: Type void Example registry.forEachClass( ( className ) =&gt; { ... } ); get(className, id) This method returns one instance: with id exactly the addressed entry, without id the first instance of the class (single-instance case like the login user). Missing class or id deliver undefined. Parameters: Name Type Default Description className string The PHP class name id string | null null The instance id or null for the first instance Returns: instance The instance or undefined Type object Example const user = registry.get( 'user' ); getAll(className) This method returns a map copy of all real instances of a class: blueprints (id BLUEPRINTID) are filtered out — templates can drive card loops without a skip line, size counts only real instances. Parameters: Name Type Description className string The PHP class name Returns: instances Map copy without blueprints (id → instance) Type Map Example for( const [ key, instance ] of registry.getAll( 'User' ) ) { ... } has(className, id) This method checks whether the registry holds an instance under class name and id. Parameters: Name Type Description className string The PHP class name id string The instance id Returns: exists True when the entry exists Type boolean Example if( registry.has( 'user', 'new' ) ) { ... } onAppReady(callback) This method registers an onAppReady callback: already fired events dispatch directly with the app instance (replay), otherwise the callback waits for the Loader. Templates use this as the entry hook instead of running directly after the instantiation. Parameters: Name Type Description callback function The callback with the app instance as parameter Returns: Type void Example registry.onAppReady( ( app ) =&gt; { app.registry.getAll( 'User' ); } ); onReady(className, id, callback) This method registers a ready listener in two modes: with id an one-time delivery — an already fired event dispatches the callback directly (replay), the callback is not stored; with id null a permanent per-instance subscription of the class — the replay dispatches the callback for every already registered instance, the callback stays armed for later registrations (e. g. on-demand envelopes after appReady). Blueprints never arrive class-wide: templates which need them listen on onReady( className, 'new' ). Parameters: Name Type Default Description className string The PHP class name id string | null null The instance id or null for the class-wide subscription callback function The callback with the instance as parameter Returns: Type void Examples registry.onReady( 'User', 'new', ( blueprint ) =&gt; { ... } ); registry.onReady( 'User', null, ( instance ) =&gt; { ... } ); register(className, id, instance) This method registers an instance under class name and id and fires the ready events in order: the instance event ready:{class}:{id} first, afterwards the class-wide event ready:{class} for every class-wide listener (blueprints keep silent class-wide — the blueprint onReady path stays the dedicated route). Earlier registered listeners dispatch directly, later ones are served from the replay over firedEvents. Parameters: Name Type Description className string The PHP class name of the envelope id string The instance id (registry key) instance object The finished instance Returns: Type void Example registry.register( 'User', 'max@musterman.de', instance ); setAppReady() This method marks the app as ready — the Loader calls it once after the complete bootstrap (all resources awaited, all instances registered) and dispatches the stored onAppReady callbacks with the app instance. Returns: Type void Example registry.setAppReady(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"User.html":{"id":"User.html","title":"Class: User","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: User User This class is the frontend instance of a user: it carries the user data (without password hash — NOSERIALIZE on the PHP side) and owns its form fieldValidator through the BaseObject. It builds the top navbar of every view: app name, role-dependent menu entries and the mobile burger toggle. new User() This method is the constructor of the class: it wires only the BaseObject base — the user data arrives as envelope (fillObject). Version: 0.2.10 Since: 2026-10-16 Author: Markus Götz Returns: Type void Example const user = window[ appAlias ].registry.get( 'user' ); Methods addNavbarItem(itemName, itemLink, itemList, funct) This method appends a menu entry to a navbar list: as li with a link, with optional click callback. Parameters: Name Type Default Description itemName string The visible name of the menu entry itemLink string The link target of the menu entry itemList object The list element (or its DOM id as string) funct function null The optional click callback on the link Returns: Type void Example user.addNavbarItem( 'Dashboard', 'index.php?view=viewUserList', itemList ); addNavbarTop() This method builds the top navbar: app name, the mobile burger toggle and the menu item list. The burger carries role=\"button\" and aria-expanded as screen-reader state, Enter and Space toggle the menu like a real button. Runs only when the page carries the '#navbar-top' container. Returns: Type void Example user.addNavbarTop(); addNavbarTopItems() This method fills the navbar menu: Dashboard and Logout for every user, the user administration entry only for administrators. Returns: Type void Example user.addNavbarTopItems(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "},"Utils.html":{"id":"Utils.html","title":"Class: Utils","body":" Documentation Classes AppAppErrorBaseObjectDiagnosticsFieldValidatorLoaderRegistryUserUtils Class: Utils Utils The Utils class only contains static methods to make work easier. new Utils() Version: 0.2.10 Since: 2026-06-18 Author: Markus Götz Example const guid = Utils.guid(); Members globalRegisteredEvents :Object.&lt;string, boolean&gt; Global, static register to avoid multiple registrations of event handlers. Prevents double bindings, even with multiple class instances. Type: Object.&lt;string, boolean&gt; Example if( Utils.globalRegisteredEvents[ 'Gameplay' ] ) return; Utils.globalRegisteredEvents[ 'Gameplay' ] = true; Methods &lt;static&gt; firstLetterToLowerCase(content) This static method converts the first letter of a string to lower case. Parameters: Name Type Description content string The input string Returns: content The string with lower case first letter Type string Example const fileName = Utils.firstLetterToLowerCase( 'User' ); &lt;static&gt; firstLetterToUpperCase(content) This static method converts the first letter of a string to upper case. Parameters: Name Type Description content string The input string Returns: content The string with upper case first letter Type string Example const className = Utils.firstLetterToUpperCase( 'user' ); &lt;static&gt; getUrlParamValue(searchString, key) This static method returns a value of a url param key from a url or a part of the url. Parameters: Name Type Description searchString string The url or a part of the url key string The param name of the value Returns: value The value of the param Type string Example const value = Utils.getUrlParamValue( document.location.href, 'view' ); &lt;static&gt; guid() This static method creates a GUID. Returns: guid A GUID Type string Example const guid = Utils.guid(); &lt;static&gt; playMessageBeep() This static method plays a New Message tone. Returns: Type void Example Utils.playMessageBeep(); &lt;static&gt; s4() This static method generates a random string. Returns: randomString A random string Type string Example const randomString = Utils.s4(); &lt;static&gt; stringToJsTimestamp(dateTimeString) This static method converts a datetime string into a JavaScript timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The JavaScript Timestamp Type number Example const timestamp = Utils.stringToJsTimestamp( dateTimeString ); &lt;static&gt; stringToPhpTimestamp(dateTimeString) This static method converts a datetime string into a Php timestamp. Parameters: Name Type Description dateTimeString string The date time string Returns: timestamp The Php Timestamp Type number Example const timestamp = Utils.stringToPhpTimestamp( dateTimeString ); &lt;static&gt; timestampJsToString(timestamp, seconds, format) This static method converts a JavaScript timestamp into a human-readable format. Parameters: Name Type Description timestamp number The JavaScript Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example const dateTimeString = Utils.timestampJsToString( timestamp, seconds, format ); &lt;static&gt; timestampPhpToString(timestamp, seconds, format) This static method converts a Php timestamp into a human-readable format. Parameters: Name Type Description timestamp number The Php Timestamp seconds boolean Should the seconds be returned for the time with true or false format string The return format, date for just the date, time for just the time, or datetime for both the date and time Returns: dateTimeString The date time string Type string Example const dateTimeString = Utils.timestampPhpToString( timestamp, seconds, format ); &lt;static&gt; triggerMessageVibration() This static method triggers a vibration on an Android phone. Returns: Type void Example Utils.triggerMessageVibration(); × Search results Close Documentation generated by JSDoc 4.0.5 on 2026-10-27T13:17:13+01:00 using the DocStrap template. "}}
    </script>

    <script type="text/javascript">
        $(document).ready(function() {
            Searcher.init();
        });

        $(window).on("message", function(msg) {
            var msgData = msg.originalEvent.data;

            if (msgData.msgid != "docstrap.quicksearch.start") {
                return;
            }

            var results = Searcher.search(msgData.searchTerms);

            window.parent.postMessage({"results": results, "msgid": "docstrap.quicksearch.done"}, "*");
        });
    </script>
</body>
